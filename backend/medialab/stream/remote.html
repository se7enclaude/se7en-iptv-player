<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<meta name="referrer" content="no-referrer">
<title>Télécommande · se7en IPTV Player</title>
<style>
  :root { --bg: #0b0b0e; --card: rgba(255,255,255,.07); --line: rgba(255,255,255,.12); --text: #f4f4f6; --muted: rgba(244,244,246,.6);
          --accent: #ee2e37; --ok: #fff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.35 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; }
  body { padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; user-select: none; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .brand { font-weight: 800; letter-spacing: -.02em; font-size: 17px; }
  .brand b { color: var(--accent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #3c3; box-shadow: 0 0 10px #3c3; }
  .dot.off { background: #c33; box-shadow: 0 0 10px #c33; }
  .now { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); min-height: 84px; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: #fff; display: grid; place-items: center; overflow: hidden; flex: none; color: #111; font-weight: 800; }
  .logo img { width: 82%; height: 82%; object-fit: contain; }
  .now-text { min-width: 0; }
  .now-title { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-prog { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.15); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
  .pad { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 12px; margin-top: 18px; align-items: stretch; }
  button { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--card); border-radius: 20px; min-height: 64px; cursor: pointer;
           display: flex; align-items: center; justify-content: center; gap: 8px; touch-action: manipulation; transition: transform .08s, background .15s; }
  button:active { transform: scale(.96); background: rgba(255,255,255,.16); }
  button svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .col { display: grid; gap: 12px; }
  .big { min-height: 88px; font-weight: 700; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
  .big svg { width: 32px; height: 32px; color: var(--text); }
  .play { background: #fff; color: #0b0b0e; border-color: #fff; }
  .play svg { color: #0b0b0e; }
  .play:active { background: #ddd; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
  .row button { min-height: 56px; font-size: 12px; flex-direction: column; gap: 2px; color: var(--muted); }
  .row button svg { width: 22px; height: 22px; color: var(--text); }
  .on { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
  .on svg { color: #fff !important; }
  .tabs { display: flex; gap: 8px; margin: 22px 0 10px; }
  .tabs button { min-height: 40px; padding: 0 16px; border-radius: 99px; font-size: 14px; flex: none; }
  .tabs button.sel { background: #fff; color: #0b0b0e; border-color: #fff; }
  .digits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .digits button { min-height: 60px; font-size: 22px; font-weight: 700; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .ch { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 6px 12px; justify-content: flex-start; border-radius: 16px; text-align: left; }
  .ch .logo { width: 40px; height: 40px; border-radius: 10px; font-size: 12px; }
  .ch-num { width: 30px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; flex: none; }
  .ch-text { min-width: 0; display: flex; flex-direction: column; }
  .ch-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-now { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch.cur { border-color: var(--accent); }
  input { width: 100%; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 0 14px; font: inherit; margin-bottom: 10px; }
  .toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: #2a2b31; padding: 10px 16px; border-radius: 14px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; }
  .toast.show { opacity: 1; }
  .empty { color: var(--muted); text-align: center; padding: 18px; }
</style>
</head>
<body>
<header>
  <div class="brand">se<b>7</b>en · télécommande</div>
  <div class="dot off" id="dot" title="Connexion au PC"></div>
</header>

<section class="now" id="now">
  <div class="logo" id="logo">7</div>
  <div class="now-text">
    <div class="now-title" id="title">Rien en lecture</div>
    <div class="now-prog" id="prog">Choisis une chaîne ci-dessous</div>
    <div class="bar"><i id="progress"></i></div>
  </div>
</section>

<section class="pad">
  <div class="col">
    <button class="big" data-cmd="volume" data-value="5" aria-label="Volume plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Volume</button>
    <button class="big" data-cmd="volume" data-value="-5" aria-label="Volume moins"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg><span id="vol">—</span></button>
  </div>
  <div class="col">
    <button class="big play" id="pause" data-cmd="pause" aria-label="Lecture / pause"><svg viewBox="0 0 24 24" id="pauseIcon"><path d="M8 5v14M16 5v14"/></svg></button>
    <button class="big" data-cmd="mute" id="mute" aria-label="Couper le son"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>Muet</button>
  </div>
  <div class="col">
    <button class="big" data-cmd="zap" data-value="-1" aria-label="Chaîne précédente dans la liste"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>Chaîne</button>
    <button class="big" data-cmd="zap" data-value="1" aria-label="Chaîne suivante dans la liste"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>Chaîne</button>
  </div>
</section>

<section class="row">
  <button data-cmd="previous"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Retour</button>
  <button data-cmd="osd"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>Infos</button>
  <button data-cmd="fullscreen" id="fs"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>Plein écran</button>
  <button data-cmd="stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Arrêter</button>
</section>

<nav class="tabs">
  <button data-tab="channels" class="sel">Chaînes</button>
  <button data-tab="favorites">Favoris</button>
  <button data-tab="digits">Numéro</button>
</nav>
<section id="panel"></section>
<div class="toast" id="toast"></div>

<script>
(() => {
  const base = location.pathname.replace(/\/$/, "");
  const $ = (id) => document.getElementById(id);
  let state = null, tab = "channels", filter = "", lastDraw = "";

  const toast = (t) => { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200); };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const logo = (src, name) => src ? `<img src="${esc(src)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${esc((name || "?").slice(0, 3)).replace(/'/g, "")}'))">` : esc((name || "?").slice(0, 3));
  const hm = (t) => new Date(t * 1000).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

  async function cmd(c, v) {
    if (navigator.vibrate) navigator.vibrate(12);
    try {
      const r = await fetch(base + "/api/cmd", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cmd: c, value: v }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || d.ok === false) toast(d.error || "Action impossible");
      setTimeout(poll, 250);
    } catch { toast("PC injoignable"); }
  }

  function drawNow() {
    const s = state || {};
    $("title").textContent = s.playing ? `${s.number ? s.number + " · " : ""}${s.title}` : "Rien en lecture";
    $("prog").textContent = s.now ? `${hm(s.now.start)} ${s.now.title}${s.next ? `  ·  ensuite ${s.next.title}` : ""}` : (s.playing ? (s.subtitle || "") : "Choisis une chaîne ci-dessous");
    const p = s.now ? Math.max(0, Math.min(1, (Date.now() / 1000 - s.now.start) / Math.max(1, s.now.stop - s.now.start))) : 0;
    $("progress").style.width = `${p * 100}%`;
    $("logo").innerHTML = s.playing ? logo(s.logo, s.title) : "7";
    $("vol").textContent = s.playing ? (s.muted ? "Muet" : `${s.volume} %`) : "—";
    $("mute").classList.toggle("on", !!s.muted);
    $("fs").classList.toggle("on", !!s.fullscreen);
    $("pauseIcon").innerHTML = s.paused ? '<path d="M7 4v16l13-8z"/>' : '<path d="M8 5v14M16 5v14"/>';
  }

  function drawPanel() {
    const s = state || {};
    const key = JSON.stringify([tab, filter, s.id, tab === "digits" ? 0 : (tab === "favorites" ? s.favorites : s.channels)]);
    if (key === lastDraw) return; // unchanged: keep the list (and its scroll) as it is
    lastDraw = key;
    const panel = $("panel");
    if (tab === "digits") {
      panel.innerHTML = `<div class="digits">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, ""].map((d) => d === "" ? "<span></span>" : `<button data-digit="${d}">${d}</button>`).join("")}</div>`;
      return;
    }
    const rows = (tab === "favorites" ? s.favorites : s.channels) || [];
    const f = filter.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const shown = f ? rows.filter((c) => c.name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").includes(f)) : rows;
    const focus = document.activeElement && document.activeElement.id === "q";
    panel.innerHTML = `<input id="q" placeholder="Chercher une chaîne" value="${esc(filter)}" autocomplete="off">` +
      (shown.length ? `<div class="list">${shown.map((c) => `<button class="ch${c.id === s.id ? " cur" : ""}" data-ch="${esc(c.id)}">
        <span class="ch-num">${c.num ?? ""}</span><span class="logo">${logo(c.logo, c.name)}</span>
        <span class="ch-text"><span class="ch-name">${esc(c.name)}</span><span class="ch-now">${esc(c.now || "")}</span></span></button>`).join("")}</div>`
        : `<div class="empty">${tab === "favorites" ? "Pas encore de favori : ajoute-les avec l'étoile sur le PC." : "Aucune chaîne."}</div>`);
    const q = $("q");
    q.oninput = () => { filter = q.value; lastDraw = ""; drawPanel(); };
    if (focus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }

  async function poll() {
    try {
      const r = await fetch(base + "/api/state", { cache: "no-store" });
      if (!r.ok) throw new Error();
      state = await r.json();
      $("dot").classList.remove("off");
      drawNow();
      if (!(document.activeElement && document.activeElement.id === "q")) drawPanel();
    } catch { $("dot").classList.add("off"); }
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.cmd) cmd(b.dataset.cmd, b.dataset.value !== undefined ? Number(b.dataset.value) : undefined);
    else if (b.dataset.ch) cmd("channel", b.dataset.ch);
    else if (b.dataset.digit !== undefined) cmd("digit", b.dataset.digit);
    else if (b.dataset.tab) {
      tab = b.dataset.tab; lastDraw = "";
      document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("sel", x === b));
      drawPanel();
    }
  });
  poll();
  setInterval(poll, 2000);
  document.addEventListener("visibilitychange", () => !document.hidden && poll());
})();
</script>
</body>
</html>
